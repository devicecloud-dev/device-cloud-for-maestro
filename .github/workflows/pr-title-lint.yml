name: PR Title

# Enforces Conventional Commits on the PR *title*. Because PRs are squash-merged
# with the title as the commit subject, this is what release-please parses to
# compute version bumps and the changelog — so the allowed types below must stay
# in sync with `changelog-sections` in release-please-config.json.
#
# Runs on pull_request, which also fires for PRs from forks. Fork runs get a
# read-only token and no secrets, and that is all a title check needs: it reads
# the title from the event payload and checks out no code. It used to run on
# pull_request_target, which GitHub blocks by default in public repositories
# from 2026-12-02, so don't switch back. A first-time contributor's fork PR waits
# for a maintainer to approve the run before this check reports.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in lockstep with release-please-config.json changelog-sections.
          types: |
            feat
            fix
            perf
            deps
            revert
            refactor
            docs
            chore
            test
            ci
            build
            style
