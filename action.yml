name: 'Device Cloud Action'
author: 'devicecloud.dev'
description: 'Uses devicecloud.dev to execute Maestro mobile tests'
inputs:
  api-key:
    description: 'API key for devicecloud.dev (Settings → API Keys in the console), passed from a repository secret. Required: the DEVICE_CLOUD_API_KEY environment variable does not replace it.'
    required: true
  api-url:
    description: 'API URL for devicecloud.dev'
    required: false
  app-file:
    description: 'App binary to run your flows against: a path, or a glob pattern such as build/**/*.apk. When a pattern matches several files, the first in sorted order is used.'
    required: false
  app-binary-id:
    description: 'The ID of the app binary previously uploaded to devicecloud.dev'
    required: false
  android-api-level:
    description: '[Android only] Android API level to run your flow against <options: 29|30|31|32|33|34|35|36|37>'
    required: false
  android-device:
    description: '[Android only] Android device to run your flow against <options: pixel-6|pixel-6-pro|pixel-7|pixel-7-pro|pixel-8|pixel-10|pixel-10-pro|pixel-10-pro-xl|pixel-10-pro-fold|pixel-11|generic-tablet>'
    required: false
  async:
    description: 'Immediately return (exit code 0) from the command without waiting for the results of the run (useful for saving CI minutes)'
    required: false
  cancel-previous:
    description: 'Cancel the still-queued tests of the previous run of this job on the same branch or PR. Tests already running are left to finish; cancelled tests are refunded at 75%. Set check-name per job when one commit runs this action more than once, since it scopes the group. The superseded run''s job passes, with DEVICE_CLOUD_UPLOAD_STATUS set to SUPERSEDED'
    required: false
  device-locale:
    description: 'Locale that will be set to a device, ISO-639-1 code and uppercase ISO-3166-1 code e.g. "de_DE" for Germany'
    required: false
  download-artifacts:
    description: 'Download a zip containing the logs, screenshots and videos for each result in this run. Use FAILED for failures only or ALL for every result. <options: ALL|FAILED>'
    required: false
  env:
    description: 'One or more environment variables to inject into your flows'
    required: false
  json-file:
    description: 'Write the results as JSON to <upload_id>_dcd.json'
    required: false
  exclude-flows:
    description: 'Sub directories to ignore when building the flow file list'
    required: false
  exclude-tags:
    description: 'Flows which have these tags will be excluded from the run'
    required: false
  flows:
    description: 'The path to the flow file or folder containing your flows'
    required: false
  google-play:
    description: '[Android only] Run your flow against Google Play devices'
    required: false
  ignore-sha-check:
    description: 'Ignore the sha hash check and upload the binary regardless of whether it already exists (not recommended)'
    required: false
  include-tags:
    description: 'Only flows which have these tags will be included in the run'
    required: false
  ios-device:
    description: '[iOS only] iOS device to run your flow against <options: iphone-14|iphone-15|iphone-16|iphone-16-plus|iphone-16-pro|iphone-16-pro-max|iphone-17|iphone-air|iphone-18-pro|iphone-18-pro-max|ipad-pro-6th-gen|ipad-pro-m5-11|ipad-pro-m5-13>'
    required: false
  ios-version:
    description: '[iOS only] iOS version to run your flow against <options: 17|18|26|27>'
    required: false
  maestro-version:
    description: 'Maestro version to run your flow against'
    required: false
  moropo-v1-api-key:
    description: 'API key for Moropo v1 integration'
    required: false
  name:
    description: 'A custom name for your upload (useful for tagging commits etc)'
    required: false
  orientation:
    description: '[Android only] The orientation of the device to run your flow against in degrees <options: 0|90>'
    required: false
  quiet:
    description: 'Quieter console output without progress updates while the run is polled. Set to "false" to see them.'
    required: false
    default: 'true'
  report:
    description: 'Runs Maestro with the --format flag, this will generate a report in the specified format <options: junit|html|html-detailed>'
    required: false
  retry:
    description: 'Number of times to retry the run if it fails (same as pressing retry in the UI, this is free)'
    required: false
  workspace:
    description: 'The path to the workspace folder containing your flows'
    required: false
    default: './.maestro/'
  config:
    description: 'Specific path to your maestro config file'
    required: false
  runner-type:
    description: '[experimental] The type of runner to use <options: default|m4|m1|gpu1|cpu1>. m4 is iOS-only; m1, gpu1 and cpu1 are Android runners (cpu1 is the Android default). m4, m1 and gpu1 are billed at the advanced rate. See https://docs.devicecloud.dev/configuration/runner-type for more information'
    required: false
    default: 'default'
  render-engine:
    description: '[Android only] Software renderer the emulator boots with <options: lavapipe|swiftshader>. Leave unset to let DeviceCloud choose: lavapipe by default, swiftshader for apps shipping the Flutter engine.'
    required: false
  debug:
    description: 'Enable debug mode for more verbose output'
    required: false
  use-beta:
    description: 'Use the beta version of the DCD CLI instead of the latest stable version'
    required: false
  maestro-chrome-onboarding:
    description: '[Android only] Force Maestro-based Chrome onboarding - note: this will slow your tests but can fix browser related crashes. See https://docs.devicecloud.dev/reference/chrome-onboarding for more information.'
    required: false
  android-no-snapshot:
    description: '[Android only] Force cold boot instead of using snapshot boot. This is automatically enabled for API 34+ but can be used to force cold boot on older API levels.'
    required: false
  disable-animations:
    description: 'Disable device animations during test execution. On Android, disables system animation scales. On iOS, enables Reduce Motion. Reduces CPU load and may improve test reliability.'
    required: false
  include-github-context:
    description: 'Automatically attach GitHub/PR context (branch, SHA, PR number, PR URL, run ID, repo) to the test run as metadata. Set to "false" to opt out.'
    required: false
    default: 'true'
  check-name:
    description: 'Name this run''s GitHub check, e.g. "iOS" gives a check called "DeviceCloud / iOS". Use it when a PR runs more than once (iOS and Android, say) so each run gets its own check that can be required separately in branch protection. Keep it the same on every run of a given job.'
    required: false

outputs:
  DEVICE_CLOUD_CONSOLE_URL:
    description: 'URL to view the test results in the Device Cloud console'
  DEVICE_CLOUD_FLOW_RESULTS:
    description: 'JSON array with each flow''s name and status, e.g. [{"name": "...", "status": "PASSED"}]'
  DEVICE_CLOUD_UPLOAD_STATUS:
    description: 'Status of the test run: PASSED, FAILED, QUEUED, RUNNING or PENDING (always PENDING with async); SUPERSEDED when a newer run replaced it through cancel-previous; ERROR when the status could not be fetched'
  DEVICE_CLOUD_APP_BINARY_ID:
    description: 'ID of the uploaded app binary in Device Cloud'

runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'check'
  color: 'blue'
